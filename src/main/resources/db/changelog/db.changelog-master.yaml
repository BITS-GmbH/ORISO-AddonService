databaseChangeLog:
  - changeSet:
      id: 001-addon-enablement
      author: addonservice
      changes:
        - createTable:
            tableName: addon_enablement
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: addon_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: agency_id
                  type: BIGINT
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(64)
        - createIndex:
            tableName: addon_enablement
            indexName: idx_addon_enablement_lookup
            columns:
              - column:
                  name: addon_name
              - column:
                  name: tenant_id
              - column:
                  name: agency_id
        - createIndex:
            tableName: addon_enablement
            indexName: idx_addon_enablement_tenant
            columns:
              - column:
                  name: tenant_id
  - changeSet:
      id: 002-addon-setting
      author: addonservice
      changes:
        - createTable:
            tableName: addon_setting
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: addon_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: agency_id
                  type: BIGINT
              - column:
                  name: values_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(64)
        - createIndex:
            tableName: addon_setting
            indexName: idx_addon_setting_lookup
            columns:
              - column:
                  name: addon_name
              - column:
                  name: tenant_id
              - column:
                  name: agency_id
  - changeSet:
      id: 003-addon-audit-entry
      author: addonservice
      changes:
        - createTable:
            tableName: addon_audit_entry
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: addon_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(64)
              - column:
                  name: action
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: summary_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: VARCHAR(64)
              - column:
                  name: actor_username
                  type: VARCHAR(255)
              - column:
                  name: actor_roles_json
                  type: TEXT
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: agency_id
                  type: BIGINT
              - column:
                  name: session_id
                  type: BIGINT
              - column:
                  name: subject_id
                  type: VARCHAR(64)
        - createIndex:
            tableName: addon_audit_entry
            indexName: idx_addon_audit_entry_tenant
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: created_at
        - createIndex:
            tableName: addon_audit_entry
            indexName: idx_addon_audit_entry_agency
            columns:
              - column:
                  name: agency_id
              - column:
                  name: created_at
        - createIndex:
            tableName: addon_audit_entry
            indexName: idx_addon_audit_entry_addon
            columns:
              - column:
                  name: addon_name
              - column:
                  name: created_at
  - changeSet:
      id: 004-addon-global-switch
      author: addonservice
      changes:
        - createTable:
            tableName: addon_global_switch
            columns:
              - column:
                  name: addon_name
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(64)
        # Add-ons that are already switched on somewhere keep working: they start globally on.
        # Add-ons discovered later start globally off.
        - sql:
            sql: >-
              INSERT INTO addon_global_switch (addon_name, enabled, updated_at, updated_by)
              SELECT DISTINCT addon_name, TRUE, CURRENT_TIMESTAMP, 'migration'
              FROM addon_enablement WHERE enabled = TRUE
  - changeSet:
      id: 005-addon-event-delivery
      author: addonservice
      changes:
        - createTable:
            tableName: addon_event_delivery
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: addon_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: delivered_at
                  type: TIMESTAMP(6)
              - column:
                  name: failed_at
                  type: TIMESTAMP(6)
              - column:
                  name: last_error
                  type: VARCHAR(255)
        - addUniqueConstraint:
            tableName: addon_event_delivery
            constraintName: uq_addon_event_delivery
            columnNames: event_id, addon_name
        - createIndex:
            tableName: addon_event_delivery
            indexName: idx_addon_event_delivery_due
            columns:
              - column:
                  name: delivered_at
              - column:
                  name: failed_at
              - column:
                  name: next_attempt_at
